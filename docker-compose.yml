version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rabbit-postgres
    environment:
      POSTGRES_DB: rabbit_dev
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: rabbit_local_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
