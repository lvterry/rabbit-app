name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-gate:
    name: Contract Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Type check
        run: pnpm typecheck
      
      - name: Contract tests
        run: pnpm test:contract

  ios-build-gate:
    name: iOS Build Gate
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/Rabbit.xcodeproj -scheme Rabbit
      
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/Rabbit.xcodeproj \
            -scheme Rabbit \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build
